<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1226" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      // Keep the storage key in sync with src/context/ThemeContext.tsx.
      (function () {
        try {
          // No saved choice means the default (dark); 'system' follows the device.
          var saved = localStorage.getItem('route-social.theme') || 'dark';
          var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>Social Media App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
